apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ub-ssu-csi-s7-normal
provisioner: csi.unifiedbus.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ub-ssu-csi-s7-linear
provisioner: csi.unifiedbus.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
parameters:
  allocStrategy: "1"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ub-ssu-csi-s7-striped
provisioner: csi.unifiedbus.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
parameters:
  allocStrategy: "0"
  raidLevel: "0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s7-linear-pvc
  annotations:
    csi.unifiedbus.com/nsnum: "3"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-s7-linear
  volumeMode: Filesystem
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s7-striped-pvc
  annotations:
    csi.unifiedbus.com/nsnum: "3"
    csi.unifiedbus.com/chunksize: "64"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-s7-striped
  volumeMode: Filesystem
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s7-normal-fs-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-s7-normal
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s7-normal-block-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-s7-normal
  volumeMode: Block
  resources:
    requests:
      storage: 1Gi

apiVersion: v1
kind: Pod
metadata:
  name: ssu-dfx-linear-1
  labels:
    ssu-test-phase: initial
spec:
  nodeSelector:
    kubernetes.io/hostname: master
  tolerations:
    - operator: Exists
      effect: NoSchedule
  containers:
    - name: app
      image: docker.io/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ssu-dfx-linear-pvc
---

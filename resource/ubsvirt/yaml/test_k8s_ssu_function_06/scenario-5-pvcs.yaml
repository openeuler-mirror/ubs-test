apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s5-undersize-filesystem-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi
  volumeMode: Filesystem
  resources:
    requests:
      storage: 0.9Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s5-minimum-filesystem-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi

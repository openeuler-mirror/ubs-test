apiVersion: v1
kind: Pod
metadata:
  name: ssu-s4-linear-1
  labels:
    ssu-test-phase: initial
    ssu-test-anchor: linear
spec:
  containers:
    - name: app
      image: docker.io/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ssu-s4-linear-shared-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: ssu-s4-linear-2
  labels:
    ssu-test-phase: initial
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              ssu-test-anchor: linear
          topologyKey: kubernetes.io/hostname
  containers:
    - name: app
      image: docker.io/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ssu-s4-linear-shared-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: ssu-s4-striped-3
  labels:
    ssu-test-phase: initial
    ssu-test-anchor: striped-cross
spec:
  nodeSelector:
    kubernetes.io/hostname: master
  tolerations:
    - operator: Exists
      effect: NoSchedule
  containers:
    - name: app
      image: docker.io/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ssu-s4-striped-shared-pvc
---
apiVersion: v1
kind: Pod

apiVersion: v1
kind: Namespace
metadata:
  name: ssu-s4-secondary
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ub-ssu-csi-s4-linear
provisioner: csi.unifiedbus.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
parameters:
  allocStrategy: "1"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ub-ssu-csi-s4-striped
provisioner: csi.unifiedbus.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
parameters:
  allocStrategy: "0"
  raidLevel: "0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s4-linear-shared-pvc
  annotations:
    csi.unifiedbus.com/nsnum: "2"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-s4-linear
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s4-striped-shared-pvc
  annotations:
    csi.unifiedbus.com/nsnum: "3"
    csi.unifiedbus.com/chunksize: "64"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-s4-striped
  volumeMode: Filesystem
  resources:
    requests:
      storage: 3Gi

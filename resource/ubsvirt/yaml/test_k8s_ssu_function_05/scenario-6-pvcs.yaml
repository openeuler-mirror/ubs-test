apiVersion: v1
kind: Namespace
metadata:
  name: ssu-s5-secondary
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ub-ssu-csi-s5
provisioner: csi.unifiedbus.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s5-shared-block-pvc
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ub-ssu-csi-s5
  volumeMode: Block
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: ssu-s5-block-4
  namespace: ssu-s5-secondary
  labels:
    ssu-test-phase: cross-ns
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              ssu-test-anchor: block-same-node
          namespaces: [default]
          topologyKey: kubernetes.io/hostname
  tolerations:
    - operator: Exists
      effect: NoSchedule
  containers:
    - name: app
      image: docker.io/library/busybox:1.36.1

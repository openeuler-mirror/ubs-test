apiVersion: v1
kind: Pod
metadata:
  name: ssu-s5-block-1
  labels:
    ssu-test-phase: same-node
    ssu-test-anchor: block-same-node
spec:
  tolerations:
    - operator: Exists
      effect: NoSchedule
  containers:
    - name: app
      image: docker.io/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeDevices:
        - name: data
          devicePath: /dev/ssu-volume
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ssu-s5-shared-block-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: ssu-s5-block-2
  labels:
    ssu-test-phase: same-node
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              ssu-test-anchor: block-same-node
          topologyKey: kubernetes.io/hostname
  tolerations:
    - operator: Exists
      effect: NoSchedule
  containers:
    - name: app
      image: docker.io/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeDevices:
        - name: data
          devicePath: /dev/ssu-volume
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ssu-s5-shared-block-pvc
---

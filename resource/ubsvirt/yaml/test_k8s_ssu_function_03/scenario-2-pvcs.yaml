apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ub-ssu-csi-s2-linear
provisioner: csi.unifiedbus.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
parameters:
  allocStrategy: "1"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ub-ssu-csi-s2-striped
provisioner: csi.unifiedbus.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
parameters:
  allocStrategy: "0"
  raidLevel: "0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s2-linear-three-ns-pvc
  annotations:
    csi.unifiedbus.com/nsnum: "3"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-s2-linear
  volumeMode: Filesystem
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s2-striped-three-ns-pvc
  annotations:
    csi.unifiedbus.com/nsnum: "3"
    csi.unifiedbus.com/chunksize: "64"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-s2-striped
  volumeMode: Block
  resources:
    requests:
      storage: 3Gi

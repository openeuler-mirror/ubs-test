apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ub-ssu-csi-test
provisioner: csi.unifiedbus.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ub-ssu-csi-s1-linear
provisioner: csi.unifiedbus.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
parameters:
  allocStrategy: "1"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ub-ssu-csi-s1-striped
provisioner: csi.unifiedbus.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
parameters:
  allocStrategy: "0"
  raidLevel: "0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s1-normal-filesystem-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-test
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s1-normal-block-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-test
  volumeMode: Block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s1-linear-sequential-pvc
  annotations:
    csi.unifiedbus.com/nsnum: "2"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-s1-linear
  volumeMode: Filesystem
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s1-striped-distributed-pvc
  annotations:
    csi.unifiedbus.com/nsnum: "2"
    csi.unifiedbus.com/chunksize: "64"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi-s1-striped
  volumeMode: Filesystem
  resources:
    requests:
      storage: 3Gi

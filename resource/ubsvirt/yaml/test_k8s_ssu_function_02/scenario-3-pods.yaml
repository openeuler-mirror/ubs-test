apiVersion: v1
kind: Pod
metadata:
  name: ssu-s3-filesystem-workload
spec:
  containers:
    - name: app
      image: docker.io/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ssu-s3-normal-filesystem-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: ssu-s3-block-workload
spec:
  containers:
    - name: app
      image: docker.io/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeDevices:
        - name: data
          devicePath: /dev/ssu-volume
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ssu-s3-normal-block-pvc

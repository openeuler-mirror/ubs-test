apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s3-normal-filesystem-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssu-s3-normal-block-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ub-ssu-csi
  volumeMode: Block
  resources:
    requests:
      storage: 1Gi
